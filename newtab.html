<!DOCTYPE html>
<html lang="">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="newtab-jstart-flag" content="true" />
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="jstart.css">
    <link rel="stylesheet" href="newtab.css">
    <title>⭐︎JStart</title>
    <style type="text/css">body{margin: 0}</style>
    <script src="jquery-3.6.1.slim.min.js"></script>
    <script src="content.js"></script>
    <script defer src="newtab.js"></script>
    <link rel="stylesheet" href="svg.css">
</head>
<body>
    <div class="main_app">
        <div class="curveWrap" id="jstart-curveWrap">
            <svg width="100%" height="100%" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">
                <g class="curve" fill="none">
                    <path d="M 0, 60 S 300, -60, 600, 60, 800, -120, 1200 60"></path>
                    <path d="M 0, 60 S 200, -60, 400, 60, 900, -100, 1200 60"></path>
                    <path d="M 0, 60 S 200, -70, 400, 70, 800, -120, 1200 60"></path>
                    <path d="M 0, 60 S 200, -60, 400, 80, 600, -80, 1200 60"></path>
                    <path d="M 0, 60 S 200, -55, 400, 50, 800, -70, 1200 60"></path>
                    <path d="M 0, 60 S 200, -50, 400, 40, 600, -80, 1200 60"></path>
                </g>
            </svg>
        </div>
        <section class="jstart-guide" aria-label="JStart 使用说明">
            <div class="jstart-guide-inner">
                <p class="jstart-guide-kicker">JStart</p>
                <h1>使用说明</h1>
                <div class="jstart-guide-grid">
                    <div class="jstart-guide-item">
                        <kbd>⌘</kbd><span>+</span><kbd>J</kbd>
                        <p>唤起或关闭搜索框。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>⌃</kbd><span>+</span><kbd>⌘</kbd><span>+</span><kbd>←</kbd>
                        <p>在最近两个 Tab 之间来回切换。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/</kbd>
                        <p>查看可用命令，常用命令会排在前面。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/b</kbd>
                        <p>只搜索书签，适合书签很多的时候快速定位。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/t</kbd>
                        <p>搜索已打开的标签页，最近切换过的更靠前。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/h</kbd>
                        <p>按命令搜索历史记录，默认搜索不会混入历史。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>Esc</kbd>
                        <p>关闭搜索框，回到这个说明页。</p>
                    </div>
                </div>
                <p class="jstart-guide-note">直接输入会优先匹配书签和标签页；需要直接搜索当前文字时，在末尾多输入一个空格再回车。</p>
            </div>
        </section>
    </div>
</body>
</html>
