<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="newtab-jstart-flag" content="true" />
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="newtab.css">
    <title>⭐︎JStart</title>
    <script src="content.js"></script>
    <script type="module" src="newtab.js"></script>
</head>
<body>
    <div class="main_app">
        <div class="jstart-background" id="jstart-background" aria-hidden="true"></div>
        <section class="jstart-guide" aria-label="JStart 使用说明">
            <div class="jstart-guide-inner">
                <p class="jstart-guide-kicker">JStart</p>
                <h1>使用说明</h1>
                <div class="jstart-guide-grid">
                    <div class="jstart-guide-item">
                        <kbd>Tab</kbd>
                        <p>在搜索和 AI 之间切换，也可以点击输入框右侧图标。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>⇧</kbd><span>+</span><kbd>Tab</kbd>
                        <p>切换搜索引擎或大模型；鼠标悬停在右侧图标上也能选择。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>⌃</kbd><span>+</span><kbd>⌘</kbd><span>+</span><kbd>←</kbd>
                        <p>在最近两个 Tab 之间来回切换。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/</kbd>
                        <p>查看可用命令，常用命令会排在前面。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/b</kbd>
                        <p>只搜索书签，适合书签很多的时候快速定位。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/t</kbd>
                        <p>搜索已打开的标签页，最近切换过的更靠前。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>/h</kbd>
                        <p>按命令搜索历史记录，默认搜索不会混入历史。</p>
                    </div>
                    <div class="jstart-guide-item">
                        <kbd>Esc</kbd>
                        <p>关闭搜索框，回到这个说明页。</p>
                    </div>
                </div>
                <p class="jstart-guide-note">直接输入会优先匹配书签和标签页；需要直接搜索当前文字时，在末尾多输入一个空格再回车。</p>
            </div>
        </section>
    </div>
</body>
</html>
