<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStart Settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main class="options-shell">
        <header class="options-header">
            <div>
                <h1>JStart Settings</h1>
                <p>搜索与外观配置</p>
            </div>
        </header>

        <section class="appearance-settings">
            <div>
                <h2>新标签页背景</h2>
                <p>选择背景样式和是否播放动画。</p>
            </div>
            <div class="appearance-fields">
                <label>
                    <span>样式</span>
                    <select id="background-name">
                        <option value="ghost-fibers">Ghost Fibers</option>
                        <option value="letter-glitch">Letter Glitch</option>
                        <option value="soft-aurora">Soft Aurora</option>
                        <option value="floating-lines">Floating Lines</option>
                        <option value="light-pillar">Light Pillar</option>
                        <option value="light-rays">Light Rays</option>
                        <option value="galaxy">Galaxy</option>
                    </select>
                </label>
                <label>
                    <span>动画</span>
                    <select id="background-mode">
                        <option value="dynamic">动态</option>
                        <option value="static">静态</option>
                    </select>
                </label>
            </div>
        </section>

        <section class="settings-section ai-settings">
            <header class="section-header">
                <div>
                    <h2>AI 快速问答</h2>
                </div>
            </header>
            <div class="ai-panels">
                <div class="ai-panel">
                    <div class="ai-panel-header">
                        <h3>大模型设置</h3>
                        <p>请选择要使用的大模型</p>
                    </div>
                    <div class="ai-fields">
                        <label class="ai-inline-field"><span>问答平台</span><select id="ai-provider"><option value="doubao">豆包 · 火山方舟</option><option value="deepseek">DeepSeek</option><option value="mimo">MiMo · 小米</option></select></label>
                        <label class="ai-inline-field"><span>API Key</span><input id="ai-key" type="password" autocomplete="off" spellcheck="false"></label>
                        <label class="ai-prompt-field"><span>系统提示词</span><textarea id="ai-prompt" rows="5"></textarea></label>
                        <div class="ai-actions">
                            <button id="ai-save" class="primary-button" type="button" title="保存提示词">保存提示词</button>
                            <button id="ai-restore" class="ghost-button" type="button">恢复默认提示词</button>
                            <span id="ai-status" role="status"></span>
                        </div>
                    </div>
                </div>
                <div class="ai-panel">
                    <div class="ai-panel-header">
                        <h3>搜索词语义识别</h3>
                        <p>通过 DeepSeek 自动识别输入的内容是否适合大模型回答</p>
                    </div>
                    <div class="ai-fields">
                        <label class="ai-check"><input id="ai-semantic-enabled" type="checkbox"><span>启用语义识别</span></label>
                        <span id="ai-semantic-status" class="ai-semantic-status" hidden></span>
                    </div>
                </div>
            </div>
        </section>

        <section class="settings-section command-settings">
            <header class="section-header">
                <div>
                    <h2>自定义命令</h2>
                    <p>创建通过斜杠快速打开的搜索命令。</p>
                </div>
                <button class="primary-button" id="add-command" type="button">新增</button>
            </header>

            <section class="command-editor" id="command-editor" hidden>
                <input id="command-id" type="hidden">
                <label>
                    <span>命令</span>
                    <div class="command-key-field">
                        <strong>/</strong>
                        <input id="command-key" type="text" autocomplete="off" placeholder="jira">
                    </div>
                </label>
                <label>
                    <span>名称</span>
                    <input id="command-name" type="text" autocomplete="off" placeholder="Jira Issue">
                </label>
                <label class="wide-field">
                    <span>URL 模板</span>
                    <input id="command-url" type="url" autocomplete="off" placeholder="https://example.com/search?q={query}">
                </label>
                <label class="toggle-field">
                    <input id="command-newtab" type="checkbox">
                    <span>新标签页打开</span>
                </label>
                <div class="editor-actions">
                    <button class="primary-button" id="save-command" type="button">保存</button>
                    <button class="ghost-button" id="cancel-edit" type="button">取消</button>
                </div>
            </section>

            <section class="command-list" id="command-list"></section>
            <p class="empty-state" id="empty-state">还没有自定义命令</p>
        </section>

        <section class="settings-section">
            <header class="section-header">
                <div>
                    <h2>忽略书签目录</h2>
                    <p>被忽略目录内的书签不会出现在 JStart 搜索结果里。</p>
                </div>
                <button class="primary-button" id="save-bookmark-folders" type="button">保存</button>
            </header>
            <div class="bookmark-folder-list" id="bookmark-folder-list"></div>
            <p class="empty-state" id="bookmark-empty-state" hidden>没有可配置的书签目录</p>
        </section>
    </main>
    <script src="options.js"></script>
    <script type="module" src="options-ai.js"></script>
</body>
</html>
